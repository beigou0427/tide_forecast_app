name: tide_forecast_app
description: "潮汐表 Pro - 釣魚海象浪高與風速預報，老船長 AI 出海決策與純潮汐航海儀表"
publish_to: 'none'
version: 2.6.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_riverpod: ^2.4.9
  http: ^1.1.0
  intl: ^0.20.2
  fl_chart: ^0.65.0
  geolocator: ^10.1.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

  in_app_purchase: ^3.1.11
  in_app_purchase_storekit: ^0.3.16
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  share_plus: ^10.1.4
  path_provider: ^2.1.2
  in_app_review: ^2.0.9
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_tts: ^4.2.2
  firebase_messaging: ^16.7.0
  image_picker: ^1.1.2
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  cached_network_image: ^3.4.1
  # 🌟 VVIP 核心：加入螢幕常亮控制套件，防範駕駛台航海儀表熄火
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/stations_config.json
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#021B33"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#021B33"
  image: "assets/icon/app_icon.png"
  android_12:
    color: "#021B33"
    image: "assets/icon/app_icon.png"