name: tide_forecast_app
description: "專業級台灣海象與潮汐預報儀表板。支援 86 個測站實時監控、30 天歷史回測、未來一個月預報及 Apple/Google 訂閱功能。"

publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_riverpod: ^2.4.9
  http: ^1.1.0
  intl: ^0.20.2                 
  fl_chart: ^0.65.0
  geolocator: ^10.1.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

  # 🌟 恢復使用官方原生內購套件
  in_app_purchase: ^3.1.11
  in_app_purchase_storekit: ^0.3.16
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  in_app_review: ^2.0.12
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
