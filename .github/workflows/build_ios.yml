name: Build & Verify iOS Release

on:
  workflow_dispatch: # 🌟 終極省額度：僅限手動點擊「Run workflow」才啟動編譯，平時 git push 0 消耗額度！

jobs:
  build:
    name: Build iOS IPA & Run VVIP Audits
    runs-on: macos-latest

    steps:
      - name: 📥 簽出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 🐦 配置 Flutter 官方穩定環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 安裝專案依賴項
        run: flutter pub get

      - name: 🔍 執行靜態語法分析 (驗證 0 錯誤)
        run: flutter analyze

      - name: 🧪 執行 VVIP 海事純潮汐標準與安全性測試
        run: flutter test test/vvip_audit_test.dart

      - name: 🔨 雲端編譯 iOS 原生 Release 構建產物
        run: flutter build ios --release --no-codesign

      - name: 📦 封裝生成 TidePro_Release.ipa
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r TidePro_Release.ipa Payload
          cd ../../..

      - name: 🚀 上傳 IPA 構建成品至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TidePro_iOS_Release
          path: build/ios/iphoneos/TidePro_Release.ipa