name: Tide Pro iOS App Store Release (SSOT Pipeline)

on:
  push:
    tags:
      - 'v*' # 僅在打上版本 Tag 時觸發 (例如: git tag v2.6.0)

jobs:
  build_and_upload:
    name: 🍎 Build and Upload iOS App
    runs-on: macos-14 # 強制指定現代 macOS 環境

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔐 Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: 🔨 Build Flutter iOS IPA (Release) & Dynamic Build Number
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/exportOptions.plist \
            --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: 🧠 Upload Obfuscated Symbols to Firebase Crashlytics
        env:
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          FIREBASE_APP_ID: 1:725347285427:ios:b7f019c72776a50e6c33c6
        run: |
          npm install -g firebase-tools
          firebase crashlytics:symbols:upload \
            --app=$FIREBASE_APP_ID \
            --token=$FIREBASE_CLI_TOKEN \
            build/app/outputs/symbols

      - name: 🚀 Upload to App Store Connect (Official Altool Standard)
        env:
          APP_STORE_ISSUER_ID: 7c8a4cba-398c-4e88-88bb-9252f72ecdc9
          APP_STORE_KEY_ID: WC3YUQ44X5
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY_BASE64 }}
          APP_APPLE_ID: 6761328495
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_PRIVATE_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" -print -quit)

          # 🌟 官方認證升級：使用最新支援的 upload-package，消滅 Deprecated 崩潰！
          xcrun altool --upload-package "$IPA_PATH" \
            --type ios \
            --apple-id "$APP_APPLE_ID" \
            --bundle-id "com.beigou.tideForecastApp" \
            --apiKey "$APP_STORE_KEY_ID" \
            --apiIssuer "$APP_STORE_ISSUER_ID" \
            --show-progress
