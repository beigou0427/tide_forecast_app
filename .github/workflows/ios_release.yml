name: Tide Pro iOS App Store Release (SSOT Pipeline)

on:
  push:
    tags:
      - 'v*' # 僅在打上版本 Tag 時觸發 (例如: git tag v2.6.0)

jobs:
  build_and_upload:
    name: 🍎 Build and Upload iOS App
    runs-on: macos-14 # 強制指定現代 macOS 環境

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔐 Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: 🔨 Build Flutter iOS IPA (Release) & Dynamic Build Number
        # 🚨 核心防線 1：動態注入 GitHub Run Number 避免 Apple 重複版本號拒審！
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/exportOptions.plist \
            --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: 🧠 Upload Obfuscated Symbols to Firebase Crashlytics
        # 🚨 核心防線 2：強制上傳混淆後的符號表，否則 Firebase 崩潰日誌將變成無法解讀的天書！
        env:
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          FIREBASE_APP_ID: 1:725347285427:ios:b7f019c72776a50e6c33c6
        run: |
          npm install -g firebase-tools
          firebase crashlytics:symbols:upload \
            --app=$FIREBASE_APP_ID \
            --token=$FIREBASE_CLI_TOKEN \
            build/app/outputs/symbols

      - name: 🚀 Upload to App Store Connect via iTMSTransporter
        # 🚨 核心防線 3：廢棄已死亡的 altool，改用 Apple 官方最新 iTMSTransporter 協議！
        env:
          APP_STORE_ISSUER_ID: 7c8a4cba-398c-4e88-88bb-9252f72ecdc9
          APP_STORE_KEY_ID: WC3YUQ44X5
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY_BASE64 }}
        run: |
          # 建立 Apple 要求的 AuthKey 目錄結構
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_PRIVATE_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8

          # 抓取編譯出的 ipa 檔案路徑
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" -print -quit)

          # 使用現代 iTMSTransporter 安全上傳
          xcrun iTMSTransporter -m upload -f "$IPA_PATH" \
            -apiIssuer "$APP_STORE_ISSUER_ID" \
            -apiKey "$APP_STORE_KEY_ID" \
            -v eXtreme