name: 每日 8 次全台 85 測站海象與 AI 自動同步
on:
  workflow_dispatch:
  schedule:
    # 🌟 成本優化：改為每 3 小時執行一次 (0,3,6,9,12,15,18,21 點)
    # 確保 Gemini API (680次/天) 與 GitHub Actions (1560分/月) 完美落在免費額度內
    - cron: '0 */3 * * *'
jobs:
  tide-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安裝 Python 核心依賴
        run: |
          pip install requests
          pip install google-generativeai
      - name: 執行全台 85 測站數據抓取與 AI 大腦邊緣快照生成
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python tide_backend/tide_engine.py
      - name: 發布至 GitHub Pages (api-data 分支)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: api-data
          publish_dir: ./deploy_api
          enable_jekyll: false