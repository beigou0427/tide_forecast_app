name: 每小時 AI 海象同步
on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
jobs:
  tide-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install
        run: pip install requests google-generativeai
      - name: Run
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python tide_backend/tide_engine.py
      - name: Deploy
        run: |
          git config --global user.name "TideBot"
          git config --global user.email "bot@tide.app"
          git checkout -B api-data
          git add public/api/*.json
          git commit -m "AI 同步: $(date)"
          git push origin api-data --force
