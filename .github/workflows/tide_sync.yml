name: 每小時 AI 海象同步
on:
  workflow_dispatch:
  schedule:
    - cron: '40 * * * *'
jobs:
  tide-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests google-generativeai
      - name: 🚀 執行腳本
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python tide_backend/tide_engine.py
      - name: 📤 暴力覆蓋部署
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: api-data
          publish_dir: ./deploy_api
          enable_jekyll: false
