name: 每日 8 次全台 85 測站海象與 AI 自動同步 (含 MLOps 質檢閘門與 SRE 心跳)
on:
  workflow_dispatch:
  schedule:
    # 週末與平日全天候高頻水文巡航 (每 3 小時一次)
    - cron: '0 */3 * * *'
jobs:
  tide-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安裝 Python 核心依賴
        run: |
          pip install requests
          pip install google-generativeai

      # 🌟 Gwynne Shotwell 故障自癒：遭遇氣象署網路抖動時自動發起二度重試
      - name: 執行全台 85 測站數據抓取與 AI 大腦邊緣快照生成 (含 SRE 自動重試)
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          python tide_backend/tide_engine.py || (echo '⚠️ 初次連線氣象署異常，等待 15 秒後執行 SRE 自動二度重試...' && sleep 15 && python tide_backend/tide_engine.py)

      # 發布前強制執行物理規律、感測器斷線防線與結構化質檢閘門
      - name: 🛡️ MLOps 質檢閘門：檢驗 85 站 AI 結構、數值邊界與海事物理防線
        run: |
          python -c "
          import json, os, sys, glob

          deploy_dir = 'deploy_api'
          if not os.path.exists(deploy_dir):
              print('❌ [MLOps 質檢失敗] deploy_api 目錄不存在！')
              sys.exit(1)

          cfg_path = os.path.join(deploy_dir, 'stations_config.json')
          if not os.path.exists(cfg_path):
              print('❌ [MLOps 質檢失敗] stations_config.json 缺失！')
              sys.exit(1)

          with open(cfg_path, 'r', encoding='utf-8') as f:
              configs = json.load(f)

          if len(configs) != 85:
              print(f'❌ [MLOps 質檢失敗] 測站數量不符，應為 85 站，實測：{len(configs)} 站')
              sys.exit(1)

          edge_files = glob.glob(os.path.join(deploy_dir, 'edge_*.json'))
          if len(edge_files) != 85:
              print(f'❌ [MLOps 質檢失敗] 快照缺失，應為 85 份，實測：{len(edge_files)} 份')
              sys.exit(1)

          hallucination_count = 0
          safety_drift_count = 0
          coord_error_count = 0

          for ef in edge_files:
              with open(ef, 'r', encoding='utf-8') as f:
                  data = json.load(f)

              ai = data.get('ai_expert', {})
              score = ai.get('safety_score')
              briefing = ai.get('briefing', '')
              acts = ai.get('activities', [])

              # 1. 結構與評分邊界約束檢驗
              if score is None or not (0 <= score <= 100) or not briefing or not isinstance(acts, list):
                  hallucination_count += 1
                  print(f'⚠️ [結構異常] {ef}: AI 輸出缺失或安全分超出 [0, 100] 邊界！')

              # 2. 地理坐標邊界防護 (杜絕 Null Island 0, 0 坐標)
              st_info = data.get('station_info', {})
              try:
                  lat = float(st_info.get('lat', 0))
                  lng = float(st_info.get('lng', 0))
                  if not (20.0 <= lat <= 27.5 and 116.0 <= lng <= 124.0):
                      coord_error_count += 1
                      print(f'🚨 [坐標漂移攔截] {ef}: 坐標 ({lat}, {lng}) 偏離台灣海域或呈現 0.0 壞死！')
              except:
                  coord_error_count += 1

              # 3. 海洋物理回歸防線 (生命安全防衛)
              obs = data.get('obs', {})
              we = obs.get('WeatherElements') or obs.get('WeatherElement') or {}
              wave = obs.get('Wave') or {}
              
              raw_h = we.get('WaveHeight') if we.get('WaveHeight') is not None else wave.get('WaveHeight')
              raw_p = we.get('WavePeriod') if we.get('WavePeriod') is not None else wave.get('WavePeriod')
              
              is_sensor_offline = (raw_h is None or str(raw_h).strip() in ('None', '-99', '-999', 'nan', ''))
              
              # 斷線時嚴禁給出超過 35 分的高分
              if is_sensor_offline and score > 35:
                  safety_drift_count += 1
                  print(f'🚨 [斷線安全漂移] {ef}: 感測器離線無數據，AI 卻給出高分 {score}！')
                  continue

              try:
                  h = float(raw_h) if not is_sensor_offline else 0.0
                  p = float(raw_p) if raw_p and str(raw_p).strip() not in ('None', '-99', '-999', 'nan', '') else 0.0
              except:
                  h, p = 0.0, 0.0

              # 長週期長湧瘋狗浪防線：若週期 >= 10s 且浪高 >= 0.7m，安全分嚴禁超過 35 分！
              if p >= 10.0 and h >= 0.7 and score > 35:
                  safety_drift_count += 1
                  print(f'🚨 [長湧安全漂移] {ef}: 浪高 {h}m、週期 {p}s 具致命長湧瘋狗浪風險，AI 給出高分 {score}！')
              
              if h >= 2.5 and score > 40:
                  safety_drift_count += 1
                  print(f'🚨 [巨浪安全漂移] {ef}: 浪高 {h}m 屬危險海象，AI 給分過高 {score}！')

          print(f'📊 [MLOps 質檢報告] 通過率：{(85 - hallucination_count)/85*100:.1f}% | 結構異常：{hallucination_count} 站 | 物理安全漂移：{safety_drift_count} 站 | 坐標異常：{coord_error_count} 站')

          if hallucination_count > 10 or safety_drift_count > 0 or coord_error_count > 0:
              print('❌ [MLOps 阻斷發布] 偵測到重大 AI 幻覺、坐標漂移或物理安全防線失守，強制終止發布！')
              sys.exit(1)

          print('✅ [MLOps 質檢通過] 85 測站 AI 輸出完全符合海洋物理學、地理拓撲與生命安全約束！')
          "

      # 🌟 Gwynne Shotwell 航太看門狗：產出即時 SRE 心跳報告 (Canary Heartbeat)
      - name: 🛰️ 生成 SRE 看門狗健康心跳 (Canary Heartbeat)
        run: |
          python -c "
          import json, os, glob
          from datetime import datetime, timezone, timedelta
          tz_tw = timezone(timedelta(hours=8))
          now_tw = datetime.now(tz_tw)

          deploy_dir = 'deploy_api'
          edge_files = glob.glob(os.path.join(deploy_dir, 'edge_*.json'))
          archive_files = glob.glob(os.path.join(deploy_dir, 'archive_*.json'))

          health = {
              'system_name': 'TidePro Marine Telemetry Engine',
              'status': 'OPERATIONAL' if len(edge_files) == 85 else 'DEGRADED',
              'heartbeat_utc': datetime.now(timezone.utc).isoformat(),
              'heartbeat_taipei': now_tw.isoformat(),
              'total_stations': len(edge_files),
              'total_archives': len(archive_files),
              'circuit_breaker': False,
              'canary_version': '2.2.0-mission-critical',
              'run_id': os.environ.get('GITHUB_RUN_ID', 'local'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT', '1')
          }

          with open(os.path.join(deploy_dir, 'health_status.json'), 'w', encoding='utf-8') as f:
              json.dump(health, f, indent=2, ensure_ascii=False)
          print('✅ [SpaceX 看門狗] health_status.json 心跳檔案生成完畢，供客戶端與外部 APM 探針監測！')
          "

      - name: 發布至 GitHub Pages (api-data 分支)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: api-data
          publish_dir: ./deploy_api
          enable_jekyll: false

      - name: 🚨 SRE 故障升級通報 (Failure Alert)
        if: failure()
        run: |
          echo "::error title=航太級水文管線中斷::全台 85 測站同步管線異常中斷！請即刻檢視 SRE 質檢日誌與 CWA API 配額！"
