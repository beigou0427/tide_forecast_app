name: 每小時 AI 海象同步
on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'
jobs:
  tide-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests google-generativeai
      - env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python tide_backend/tide_engine.py

      - name: 🚀 核彈級強制推送至 api-data 分支
        run: |
          cd deploy_api
          git init
          git config user.name "TideBot"
          git config user.email "bot@tide.app"
          git add .
          git commit -m "AI Data Update: $(date)"
          # 使用 Token 進行暴力強制推送，覆蓋 api-data 分支
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:api-data
